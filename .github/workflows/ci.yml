name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: WS event schema is current
        run: |
          uv run python -m app.schemas.events --out web/src/types/events.schema.json
          git diff --exit-code web/src/types/events.schema.json

      - name: Pytest (skip slow)
        run: uv run pytest -q -m "not slow"

      - name: Offline oracle policy eval
        run: >
          uv run python -m eval.run_eval
          --nlu oracle
          --nlg template
          --sim-phrasing template
          --scenarios 100
          --seed 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated WS types are current
        run: |
          npm run gen:types
          git diff --exit-code src/types/events.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
