# Keep the hosted demo (Render free tier) warm so the first click does not wait
# for a cold start. Pings GET /healthz, which touches no LLM, engine or database.
#
# The schedule is OFF on purpose: pushing this file must not start pinging the
# live service. The repo owner enables it by uncommenting the `schedule` block.
name: keep-warm

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/10 * * * *"   # every 10 minutes (owner enables this)

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          DEMO_URL: https://debt-settlement-agent-ggor.onrender.com
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 \
            -o /dev/null -w "healthz %{http_code} in %{time_total}s\n" \
            "$DEMO_URL/healthz"
