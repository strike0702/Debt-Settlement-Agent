# Keep the hosted demo (Render free tier) warm so the first click does not wait
# for a cold start. Pings GET /healthz, which touches no LLM, engine or database.
#
# The schedule was enabled by the repo owner on 2026-10-07. Pings every 10 minutes
# (best effort; GitHub may delay scheduled runs). Run it by hand via workflow_dispatch.
name: keep-warm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          DEMO_URL: https://debt-settlement-agent-ggor.onrender.com
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 \
            -o /dev/null -w "healthz %{http_code} in %{time_total}s\n" \
            "$DEMO_URL/healthz"
