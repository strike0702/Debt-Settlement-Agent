# Free-tier OpenAI-compatible provider pool, plus one paid Anthropic provider
# used by the eval-only `judge` role (Phase 30, Sonnet) and, under a daily budget,
# as the demo NLU's first target (Phase 41; Haiku since Phase 43). Limits change; check each console.
# Route entry key `budgeted: true` puts that target under the daily budget
# (Settings.claude_daily_budget_usd); its provider must price the model.
# A route entry is `provider/model` (model may contain slashes, e.g.
# openai/gpt-oss-120b) or a mapping:
#   {target: provider/model, params: {reasoning_effort: low}, timeout_s: 20}
# `params` go into the request body (and the response-cache key); `timeout_s`
# overrides Settings.llm_timeout_<role>_s for that target.
#
# Keys: a provider's pool is key_env (if set) plus key_env_1, key_env_2, ...
# (contiguous from 1), deduplicated. Requests round-robin over the pool; a 429
# cools that key and the call moves to the next key before failing over.
# Buckets are per (provider, key, model): rpm burst min(rpm, 5), refill rpm/60
# per second, and, when `tpm` is set, a tokens-per-minute budget per key.
#
# Mistral stays in the pool as a *last* fallback only (Experiment plan often needs
# phone/workspace setup; keys may 429 with limit-req-minute=0 until then).

profiles:
  demo: # latency first; Groq, then Cerebras / Gemini; Mistral last
    # reasoning_effort: low was gated on the NLU corpus (2026-10-07) and failed:
    # private-info recall drops > 2 points (docs/eval/nlu_corpus.md, LOW_EFFORT).
    # Fallback is Cerebras with the same model: Gemini NLU (p50 11.4 s) cannot
    # finish inside the 6 s NLU timeout (carry-over 21.4).
    #
    # Phase 43: Claude Haiku 5.5 reads the rep first (HAIKU_P43_FIX in
    # docs/eval/nlu_corpus.md: stance 0.869 vs Sonnet's 0.820 on the old prompt,
    # ~1.2 s p50, ~1/16 the cost per call; it replaced Sonnet from Phase 41). Paid, so
    # `budgeted`: once today's spend reaches CLAUDE_DAILY_BUDGET_USD (default
    # $1, UTC day) it is skipped until 00:00 UTC. With no ANTHROPIC_API_KEY it
    # is skipped silently. No timeout_s: the 6 s NLU role timeout applies, and
    # a timeout fails over to the free chain below (unchanged).
    nlu:
      - {target: anthropic/claude-haiku-5-5, params: {output_config: {effort: low}}, budgeted: true}
      - groq/openai/gpt-oss-120b
      - cerebras/gpt-oss-120b
      - gemini/gemini-3.1-flash-lite
      - mistral/mistral-small-latest
    # NLG writes a one-line template; low effort keeps reasoning tokens from
    # using up the completion budget (carry-over 21.7). Bank mode never calls it.
    nlg:
      - {target: groq/openai/gpt-oss-20b, params: {reasoning_effort: low}}
      - gemini/gemini-3.1-flash-lite
    stt: [groq/whisper-large-v3-turbo]
  eval: # quota first; never put Mistral first
    nlu:
      # Measured 2026-10-07: Gemini NLU p50 11.4 s / p95 17.5 s (n=15), so the
      # 6 s role default would time out nearly every call.
      - {target: gemini/gemini-3.1-flash-lite, timeout_s: 20}
      - cerebras/gpt-oss-120b
      - groq/openai/gpt-oss-120b
      - openrouter/cohere/north-mini-code:free
      - mistral/mistral-small-latest
    nlg:
      - gemini/gemini-3.1-flash-lite
      - {target: groq/openai/gpt-oss-20b, params: {reasoning_effort: low}}
    # Eval-only A/B agent arms (eval/agents): free-tier only, and a different
    # primary than nlu so the arms do not starve the shared Gemini quota.
    # Bounded by Settings.llm_timeout_agent_s (20 s) unless overridden here.
    agent:
      - groq/openai/gpt-oss-120b
      - cerebras/gpt-oss-120b
      - {target: gemini/gemini-3.1-flash-lite, timeout_s: 25}
    # The simulated rep (Phase 46c, user decision 2026-10-09): Groq gpt-oss-120b,
    # then Cerebras with the same model, then Gemini. Low effort on both gpt-oss
    # targets so reasoning cannot use up the rewrite's token budget (P46a smoke:
    # 8 of 28 rewrites came back empty from Cerebras at default effort).
    sim:
      - {target: groq/openai/gpt-oss-120b, params: {reasoning_effort: low}}
      - {target: cerebras/gpt-oss-120b, params: {reasoning_effort: low}}
      - gemini/gemini-3.1-flash-lite
    # Naturalness judge (eval/judge_naturalness): paid, ONE target on purpose.
    # No free-tier fallback: a judge that switches model mid-run corrupts the
    # metric, so a failure raises instead. Low effort keeps thinking short.
    judge: &judge
      - {target: anthropic/claude-sonnet-5-5, params: {output_config: {effort: low}}}
  local: # unlimited eval on the laptop; cloud only as fallback
    nlu: [ollama/qwen3.5:9b, gemini/gemini-3.1-flash-lite, mistral/mistral-small-latest]
    nlg: [ollama/gemma4:e4b, gemini/gemini-3.1-flash-lite]
    sim: [ollama/gemma4:e4b, gemini/gemini-3.1-flash-lite]
    judge: *judge
  offline: # CI; no network
    all: [fake]

providers:
  groq:
    base_url: "https://api.groq.com/openai/v1"
    key_env: GROQ_API_KEY
    rpm: 25
    tpm: 8000 # free tier, per org (= per key when keys are in separate orgs)
    json_mode: true
  mistral:
    base_url: "https://api.mistral.ai/v1"
    key_env: MISTRAL_API_KEY
    rpm: 50
    min_interval_s: 1.1
    json_mode: true
  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    key_env: GEMINI_API_KEY
    rpm: 12
    json_mode: true
    quota_as_400: true
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    key_env: OPENROUTER_API_KEY
    rpm: 18
    json_mode: false
  cerebras:
    base_url: "https://api.cerebras.ai/v1"
    key_env: CEREBRAS_API_KEY
    # Free tier, gpt-oss-120b (inference-docs.cerebras.ai/support/rate-limits,
    # checked 2026-10-07): 5 RPM, 30K uncached TPM, 1M tokens/day.
    rpm: 5
    tpm: 30000
    json_mode: true
  anthropic: # paid; Messages API via the `anthropic` SDK (not OpenAI-compatible)
    api: anthropic
    base_url: "https://api.anthropic.com"
    key_env: ANTHROPIC_API_KEY
    rpm: 50 # tier-1 org limit; the judge makes 2 calls per scenario
    # USD per million tokens, for `budgeted` targets (Phase 41). Strings, not
    # floats: money is Decimal / integer micro-dollars. Official pricing page,
    # read 2026-10-08 (docs/eval/nlu_haiku_20261008/summary.md). Haiku is the demo
    # NLU target (Phase 43); Sonnet stays priced for reference (the judge uses it).
    prices_usd_per_mtok:
      claude-sonnet-5-5: {input: "2.00", output: "10.00"}
      claude-haiku-5-5: {input: "0.10", output: "0.50"}
  ollama:
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    rpm: 0 # no limiter
    json_mode: true
    local: true
    health: "/api/tags"
