# Happy path for balloon_structure (Phase 71a). Expected moves = the oracle run on these lines.
name: happy_balloon_structure
scenario: balloon_structure
turns:
- rep: We allow up to six payments, at least $20 each, with a balloon payment at the end.
  oracle:
    acts:
    - type: state_rule
      field: max_payments
      value: 6
      quote: six payments
    - type: state_rule
      field: min_payment_cents
      value: 2000
      quote: $20
    - type: state_rule
      field: payment_structure
      value: balloon
      quote: balloon
  expect:
    intent: ASK_SETTLEMENT
- rep: We'd settle for forty percent of the balance.
  oracle:
    acts:
    - type: price_ask
      pct: 40
      quote: forty percent
      firmness: counter
  expect:
    intent: COUNTER
    facts:
      counter_pct: 2800
- rep: We could come down to thirty five percent.
  oracle:
    acts:
    - type: price_ask
      pct: 35
      quote: thirty five percent
      firmness: counter
  expect:
    intent: COUNTER
    facts:
      counter_pct: 3000
- rep: Okay, that works for us.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Okay, that works for us.
  expect:
    intent: CONFIRM_SCHEDULE
    facts:
      settlement_pct: 3000
- rep: Yes, that schedule works.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Yes, that schedule works.
  expect:
    intent: PROPOSE_WRAP
    reason: confirmed
    facts:
      settlement_pct: 3000
