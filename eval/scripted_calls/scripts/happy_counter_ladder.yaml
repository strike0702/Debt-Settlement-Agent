# Happy path for counter_ladder (Phase 71a). Expected moves = the oracle run on these lines.
name: happy_counter_ladder
scenario: counter_ladder
turns:
- rep: We allow up to eight payments, at least $100 each, with even payments.
  oracle:
    acts:
    - type: state_rule
      field: max_payments
      value: 8
      quote: eight payments
    - type: state_rule
      field: min_payment_cents
      value: 10000
      quote: $100
    - type: state_rule
      field: payment_structure
      value: even
      quote: even payments
  expect:
    intent: ASK_SETTLEMENT
- rep: We'd settle for ninety five percent of the balance.
  oracle:
    acts:
    - type: price_ask
      pct: 95
      quote: ninety five percent
      firmness: counter
  expect:
    intent: COUNTER
    facts:
      counter_pct: 5200
- rep: We could come down to forty percent.
  oracle:
    acts:
    - type: price_ask
      pct: 40
      quote: forty percent
      firmness: counter
  expect:
    intent: CONFIRM_SCHEDULE
    reason: ask_within_offer
    facts:
      settlement_pct: 4000
- rep: Okay, that works for us.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Okay, that works for us.
  expect:
    intent: PROPOSE_WRAP
    reason: confirmed
    facts:
      settlement_pct: 4000
- rep: Yes, that schedule works.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Yes, that schedule works.
  expect:
    intent: CLOSE
    reason: post_wrap
