# Happy path for haggling_rep (Phase 71a). Expected moves = the oracle run on these lines.
name: happy_haggling_rep
scenario: haggling_rep
turns:
- rep: We allow up to eight payments, at least $100 each, with even payments.
  oracle:
    stance: info
    terms:
    - {field: max_payments, value: 8, quote: eight payments}
    - {field: min_payment_cents, value: 10000, quote: $100}
    - {field: payment_structure, value: even, quote: even payments}
  expect: {intent: ASK_SETTLEMENT}
- rep: We'd settle for seventy percent of the balance.
  oracle: {stance: offer, settlement_ask_pct: 70, ask_quote: seventy percent}
  expect:
    intent: COUNTER
    facts: {counter_pct: 4900}
- rep: We could come down to sixty five percent.
  oracle: {stance: counter, settlement_ask_pct: 65, ask_quote: sixty five percent}
  expect:
    intent: COUNTER
    facts: {counter_pct: 5100}
- rep: Okay, that works for us.
  oracle: {stance: accept}
  expect:
    intent: CONFIRM_SCHEDULE
    facts: {settlement_pct: 5100}
- rep: Yes, that schedule works.
  oracle: {stance: accept}
  expect:
    intent: PROPOSE_WRAP
    reason: confirmed
    facts: {settlement_pct: 5100}
