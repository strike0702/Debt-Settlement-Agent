# Happy path for haggling_rep (Phase 71a). Expected moves = the oracle run on these lines.
name: happy_haggling_rep
scenario: haggling_rep
turns:
- rep: We allow up to eight payments, at least $100 each, with even payments.
  oracle:
    acts:
    - type: state_rule
      field: max_payments
      value: 8
      quote: eight payments
    - type: state_rule
      field: min_payment_cents
      value: 10000
      quote: $100
    - type: state_rule
      field: payment_structure
      value: even
      quote: even payments
  expect:
    intent: ASK_SETTLEMENT
- rep: We'd settle for seventy percent of the balance.
  oracle:
    acts:
    - type: price_ask
      pct: 70
      quote: seventy percent
      firmness: counter
  expect:
    intent: COUNTER
    facts:
      counter_pct: 4900
- rep: We could come down to sixty five percent.
  oracle:
    acts:
    - type: price_ask
      pct: 65
      quote: sixty five percent
      firmness: counter
  expect:
    intent: COUNTER
    facts:
      counter_pct: 5100
- rep: Okay, that works for us.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Okay, that works for us.
  expect:
    intent: CONFIRM_SCHEDULE
    facts:
      settlement_pct: 5100
- rep: Yes, that schedule works.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Yes, that schedule works.
  expect:
    intent: PROPOSE_WRAP
    reason: confirmed
    facts:
      settlement_pct: 5100
