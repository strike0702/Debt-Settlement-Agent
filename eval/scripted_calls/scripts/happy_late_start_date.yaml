# Happy path for late_start_date (Phase 71a). Expected moves = the oracle run on these lines.
name: happy_late_start_date
scenario: late_start_date
turns:
- rep: We allow up to eight payments, at least $100 each, with even payments.
  oracle:
    acts:
    - type: state_rule
      field: max_payments
      value: 8
      quote: eight payments
    - type: state_rule
      field: min_payment_cents
      value: 10000
      quote: $100
    - type: state_rule
      field: payment_structure
      value: even
      quote: even payments
  expect:
    intent: ASK_SETTLEMENT
- rep: We'd settle for forty five percent of the balance.
  oracle:
    acts:
    - type: price_ask
      pct: 45
      quote: forty five percent
      firmness: counter
  expect:
    intent: COUNTER
    facts:
      counter_pct: 3100
- rep: We could come down to forty percent.
  oracle:
    acts:
    - type: price_ask
      pct: 40
      quote: forty percent
      firmness: counter
  expect:
    intent: COUNTER
    facts:
      counter_pct: 3300
- rep: Okay, that works for us.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Okay, that works for us.
  expect:
    intent: CONFIRM_SCHEDULE
    facts:
      settlement_pct: 3300
- rep: Yes, that schedule works.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Yes, that schedule works.
  expect:
    intent: PROPOSE_WRAP
    reason: confirmed
    facts:
      settlement_pct: 3300
