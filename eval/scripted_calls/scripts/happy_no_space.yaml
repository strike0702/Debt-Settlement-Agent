# Happy path for no_space (Phase 71a). Expected moves = the oracle run on these lines.
name: happy_no_space
scenario: no_space
turns:
- rep: We allow up to four payments, at least $350 each, with a flexible schedule.
  oracle:
    acts:
    - type: state_rule
      field: max_payments
      value: 4
      quote: four payments
    - type: state_rule
      field: min_payment_cents
      value: 35000
      quote: $350
    - type: state_rule
      field: payment_structure
      value: flexible
      quote: flexible schedule
  expect:
    intent: ASK
    reason: optional_sweep
- rep: No, nothing like that.
  oracle:
    acts: []
  expect:
    intent: ASK_SETTLEMENT
- rep: We'd settle for forty percent of the balance.
  oracle:
    acts:
    - type: price_ask
      pct: 40
      quote: forty percent
      firmness: counter
  expect:
    intent: COUNTER_TERMS
    reason: alt_first_payment_date
- rep: Okay, that works for us.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Okay, that works for us.
  expect:
    intent: ESCALATE
    reason: no_legal_counter
- rep: Yes, that schedule works.
  oracle:
    acts:
    - type: respond_to_offer
      response: accept
      quote: Yes, that schedule works.
  expect:
    intent: ESCALATE
    reason: already_escalated
