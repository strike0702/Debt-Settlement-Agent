# Live call on the AWS demo, 2026-11-08 (Claude Haiku, voice), scenario easy_deal; Phase 71c.
# Every rep line verbatim, in order. Pins the two fixes: the answer to the tier clarify
# ("I mean, one eighty dollars.") completes tier 1 and asks the next tier (live: restarted
# tier 1), and "No." to "anything else?" closes (live: ASK first_payment_date). With the
# fix the rep's next live line repeats tier 1: taken as the same tier, then the next ask.
# After the close, "That's it." meets the already-ended path. Other moves = what the live
# agent did (it was right there).
name: live_20261108_tiers_wrap
scenario: easy_deal
turns:
  # Agent: What is the maximum number of payments you can accept?
  - rep: "Let's say it."
    expect: {intent: ASK, reason: max_payments}
  - rep: "eight"
    oracle: {acts: [{type: "answer", field: "max_payments", value: 8, quote: "eight"}]}
    expect: {intent: ASK, reason: min_payment_cents}
  - rep: "One hundred and eighty dollars."
    oracle: {acts: [{type: "answer", field: "min_payment_cents", value: 18000, quote: "One hundred and eighty dollars"}]}
    expect: {intent: ASK, reason: payment_structure}
  - rep: "I'm fine with the flexible schedule."
    oracle: {acts: [{type: "answer", field: "payment_structure", value: "flexible", quote: "flexible schedule"}]}
    expect: {intent: ASK, reason: optional_sweep}
  - rep: "Yeah. I want to define three tiers."
    oracle: {acts: [{type: "announce_rules", field: "min_payment_tiers", count: 3, quote: "I want to define three tiers"}]}
    expect: {intent: ASK, reason: min_payment_tiers, facts: {tier_count: 3, tier_position: 1}}
  - rep: "It starts from one goes on till the second payment, and the minimum is one hundred dollars."
    oracle: {acts: [{type: "rule_item", from_payment: 1, to_payment: 2, min_cents: 10000, quote: "It starts from one goes on till the second payment, and the minimum is one hundred dollars"}]}
    expect: {intent: CLARIFY, reason: tiers_inconsistent, facts: {clarify_old: 18000, clarify_new: 10000}}
  # Fixed: tier 1 = payments 1-2 at least $180, then the next tier (not "Starting with tier 1").
  - rep: "I mean, one eighty dollars."
    oracle: {acts: [{type: "state_rule", field: "min_payment_cents", value: 18000, quote: "one eighty dollars"}]}
    expect: {intent: ASK, reason: min_payment_tiers, facts: {tier_position: null}}
  # The live rep repeats tier 1: same tier, no duplicate, the next tier again.
  - rep: "Yeah. It starts from payment one, and the minimum is one eighty dollars."
    oracle: {acts: [{type: "rule_item", from_payment: 1, min_cents: 18000, quote: "It starts from payment one, and the minimum is one eighty dollars"}]}
    expect: {intent: ASK, reason: min_payment_tiers, facts: {tier_position: null}}
  - rep: "It starts from the third payment, and the minimum is two hundred dollars."
    oracle: {acts: [{type: "rule_item", from_payment: 3, min_cents: 20000, quote: "It starts from the third payment, and the minimum is two hundred dollars"}]}
    expect: {intent: ASK, reason: min_payment_tiers}
  - rep: "It starts from the sixth payment onwards, and the minimum is two twenty dollars."
    oracle: {acts: [{type: "rule_item", from_payment: 6, min_cents: 22000, quote: "It starts from the sixth payment onwards, and the minimum is two twenty dollars"}]}
    expect:
      intent: READ_BACK
      reason: min_payment_tiers
      facts: {readback_value_tier_a_from: 1, readback_value_tier_a_to: 2, readback_value_tier_a_min: 18000, readback_value_tier_b_min: 20000, readback_value_tier_c_min: 22000}
  - rep: "Correct."
    oracle: {acts: [{type: "readback_reply", response: "confirm", quote: "Correct."}]}
    expect: {intent: ASK_SETTLEMENT}
  - rep: "I'm looking at eighty five percent."
    oracle: {acts: [{type: "price_ask", pct: 85, quote: "eighty five percent", firmness: "opening"}]}
    expect: {intent: COUNTER, facts: {counter_pct: 5200}}
  - rep: "Sorry. I can't go lower than seventy five percent."
    oracle: {acts: [{type: "price_ask", pct: 75, quote: "I can't go lower than seventy five percent", firmness: "final"}]}
    expect: {intent: COUNTER, facts: {counter_pct: 6300}}
  - rep: "Sorry. Seventy five percent is my floor."
    oracle: {acts: [{type: "price_ask", pct: 75, quote: "Seventy five percent is my floor", firmness: "final"}]}
    expect: {intent: CONFIRM_SCHEDULE, facts: {settlement_pct: 7500}}
  - rep: "Yeah. That works. Thank you."
    oracle: {acts: [{type: "respond_to_offer", response: "accept", quote: "Yeah. That works."}]}
    expect: {intent: PROPOSE_WRAP, reason: confirmed}
  # Agent: ... Do you need anything else before we end the call?  Fixed: closes.
  - rep: "No."
    oracle: {acts: [{type: "respond_to_offer", response: "reject", quote: "No."}]}
    expect: {intent: CLOSE, reason: post_wrap}
  - rep: "That's it."
    expect: {intent: CLOSE, reason: already_ended}
