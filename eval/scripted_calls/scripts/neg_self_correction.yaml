# 71a-2 held-out negotiation: the rep misspeaks and corrects the number in the
# same line; only the corrected number counts.
name: neg_self_correction
scenario: haggling_rep
turns:
  - rep: "Up to eight payments, at least $100 each, even payments."
    oracle: {acts: [{type: "state_rule", field: "max_payments", value: 8, quote: "eight payments"}, {type: "state_rule", field: "min_payment_cents", value: 10000, quote: "$100"}, {type: "state_rule", field: "payment_structure", value: "even", quote: "even payments"}]}
    expect: {intent: ASK_SETTLEMENT}
  - rep: "We'd be looking at around thirty... no, sorry, seventy five percent."
    oracle: {acts: [{type: "price_ask", pct: 75, quote: "seventy five percent", firmness: "counter"}]}
    expect: {intent: COUNTER, facts: {counter_pct: 5200}}
  - rep: "Sixty eight. Sorry, I meant sixty five percent, final."
    oracle: {acts: [{type: "price_ask", pct: 65, quote: "sixty five percent", firmness: "final"}]}
    expect: {intent: COUNTER, reason: final_counter, facts: {counter_pct: 5800}}
  - rep: "Okay. Fifty eight works."
    oracle: {acts: [{type: "respond_to_offer", response: "accept", quote: "Okay. Fifty eight works."}]}
    expect: {intent: CONFIRM_SCHEDULE, facts: {settlement_pct: 5800}}
