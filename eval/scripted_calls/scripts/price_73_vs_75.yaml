# The user's live 73-vs-75 call of 2026-11-07 (docs/NLU_PLAN.md context 1, verbatim
# rep lines). The agent must never accept 75% after the rep says seventy three.
name: price_73_vs_75
scenario: haggling_rep
turns:
  - rep: "Up to eight payments, at least $100 each, even payments."
    oracle: {acts: [{type: "state_rule", field: "max_payments", value: 8, quote: "eight payments"}, {type: "state_rule", field: "min_payment_cents", value: 10000, quote: "$100"}, {type: "state_rule", field: "payment_structure", value: "even", quote: "even payments"}]}
    expect: {intent: ASK_SETTLEMENT}
  - rep: "seventy five percent"
    oracle: {acts: [{type: "price_ask", pct: 75, quote: "seventy five percent", firmness: "counter"}]}
    expect: {intent: COUNTER}
  - rep: "I can't go lower than seventy five"
    oracle: {acts: [{type: "price_ask", pct: 75, quote: "seventy five", firmness: "final"}]}
    expect: {intent: COUNTER, reason: final_counter}
  - rep: "I think seventy three is the lowest I can go"
    oracle: {acts: [{type: "price_ask", pct: 73, quote: "seventy three", firmness: "final"}]}
    expect: {intent: CONFIRM_SCHEDULE, facts: {settlement_pct: 7300}}
