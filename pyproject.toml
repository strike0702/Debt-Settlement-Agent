[project]
name = "debt-settlement-agent"
version = "0.1.0"
description = "Voice agent that negotiates debt settlements"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "openai",
    "httpx",  # LLM client HTTP (Groq STT multipart + provider calls)
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "feasibility", "sim", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["feasibility"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
