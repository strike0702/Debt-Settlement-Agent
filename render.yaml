# Mirrors the hosted demo at debt-settlement-agent-ggor.onrender.com.
# Secrets (API keys) stay in the Render dashboard; none are required for offline CI.
services:
  - type: web
    name: debt-settlement-agent
    runtime: python
    plan: free
    # Install a pinned Node (the Python runtime's own Node, if any, is too old for
    # Vite 8), build web/dist, then sync Python. FastAPI serves web/dist at /.
    buildCommand: >-
      curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz | tar -xJ -C /tmp &&
      export PATH=/tmp/node-v24.21.0-linux-x64/bin:$PATH &&
      (cd web && npm ci && npm run build) &&
      pip install uv && uv sync
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LLM_PROFILE
        value: demo
      - key: NLG_MODE
        value: bank # guard-checked template bank, no NLG LLM call; `llm` still works
      - key: NLU_MODE
        value: llm
      - key: LLM_CACHE
        value: "true"
      - key: DB_PATH
        value: /opt/render/project/src/debt_settlement_agent.db
      - key: LLM_KEY_COOLDOWN_S
        value: "60" # 429 cooldown per key when there is no Retry-After
      # Key pool: NAME, then NAME_1, NAME_2, ... contiguous from 1 (a gap stops
      # the scan). Use separate orgs: free-tier limits are per org, not per key.
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # Paid (Phase 41): Claude Sonnet 5.5 reads the rep first on the demo NLU.
      # Unset = the free chain only, exactly as before.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Daily Claude cap in USD per UTC day (code default 1.00). The spend counter
      # lives in DB_PATH, which is on the instance's ephemeral disk: a restart or
      # deploy starts the day at $0 again, so also set a monthly limit in the
      # Anthropic console as the backstop.
      - key: CLAUDE_DAILY_BUDGET_USD
        sync: false
